<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111111"><title>Snake | SBH DEV Arcade</title><style>
*{box-sizing:border-box}body{margin:0;background:#101010;color:#f7f7f7;font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}.wrap{width:min(100%,760px);text-align:center}h1{font-size:clamp(24px,5vw,38px);margin:0 0 5px;letter-spacing:-1px}.sub{color:#aaa;margin:0 0 15px;font-size:13px}.bar{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:0 0 12px}.pill{border:1px solid #454545;border-radius:999px;padding:6px 12px;font-size:13px;color:#ddd}button{font:inherit;cursor:pointer;border:0;background:#f5f5f5;color:#111;padding:10px 16px;font-weight:750;border-radius:4px}button:focus-visible{outline:3px solid #aaa;outline-offset:3px}canvas{display:block;width:100%;height:auto;background:#080808;border:1px solid #444;border-radius:8px;touch-action:none}.hint{color:#aaa;font-size:12px;margin:12px 0 0}.board{margin:auto;display:grid;gap:8px;max-width:420px}.card{aspect-ratio:1;background:#242424;color:#fff;border:1px solid #555;border-radius:8px;font-size:clamp(22px,5vw,36px);display:flex;align-items:center;justify-content:center;min-width:0;padding:0}.card.revealed,.card.matched{background:#f5f5f5;color:#111;border-color:#f5f5f5}.status{min-height:24px;color:#ddd;font-size:13px;margin:10px 0}@media(max-width:480px){body{padding:10px}.pill{padding:5px 9px}}
</style></head><body><main class="wrap"><h1>Snake</h1><p class="sub">Eat the dots. Don't hit the walls or yourself. Every level gets faster.</p><div class="bar"><span class="pill">Score: <b id="score">0</b></span><span class="pill">Level: <b id="level">1</b></span><span class="pill">Food: <b id="progress">0 / 5</b></span><button id="start">Start / Restart</button></div><canvas id="game" width="480" height="480" aria-label="Snake game"></canvas><p class="hint">Use arrow keys / WASD or swipe on the board.</p><p class="status" id="status">Press Start to play.</p></main><script>(()=>{
const c=document.getElementById('game'),x=c.getContext('2d'),scoreEl=document.getElementById('score'),levelEl=document.getElementById('level'),progressEl=document.getElementById('progress'),status=document.getElementById('status'),N=20,S=c.width/N;
let snake,dir,next,food,score,timer,running,level,foodInLevel,speed;
const FOOD_PER_LEVEL=5, START_SPEED=140, MIN_SPEED=58, SPEED_STEP=10;
function placeFood(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}
function updateHud(){scoreEl.textContent=score;levelEl.textContent=level;progressEl.textContent=foodInLevel+' / '+FOOD_PER_LEVEL}
function startTimer(){clearInterval(timer);timer=setInterval(tick,speed)}
function reset(){clearInterval(timer);snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir={x:1,y:0};next={x:1,y:0};score=0;level=1;foodInLevel=0;speed=START_SPEED;running=true;status.textContent='Level 1: collect 5 dots to advance.';updateHud();placeFood();draw();startTimer()}
function levelUp(){level++;foodInLevel=0;speed=Math.max(MIN_SPEED,START_SPEED-(level-1)*SPEED_STEP);updateHud();status.textContent='Level '+level+'! The snake is faster now. Collect 5 more dots.';startTimer()}
function tick(){if(!running)return;dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(p=>p.x===h.x&&p.y===h.y)){clearInterval(timer);running=false;status.textContent='Game over! Score: '+score+' · Level reached: '+level+'. Press Start to try again.';return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score+=10;foodInLevel++;if(foodInLevel>=FOOD_PER_LEVEL)levelUp();else{updateHud();status.textContent='Level '+level+': '+(FOOD_PER_LEVEL-foodInLevel)+' more dot'+(FOOD_PER_LEVEL-foodInLevel===1?'':'s')+' to advance.'}placeFood()}else snake.pop();draw()}
function draw(){x.fillStyle='#080808';x.fillRect(0,0,c.width,c.height);x.strokeStyle='#1c1c1c';for(let i=0;i<=N;i++){x.beginPath();x.moveTo(i*S,0);x.lineTo(i*S,c.height);x.stroke();x.beginPath();x.moveTo(0,i*S);x.lineTo(c.width,i*S);x.stroke()}x.fillStyle='#f4f4f4';x.beginPath();x.arc((food.x+.5)*S,(food.y+.5)*S,S*.32,0,Math.PI*2);x.fill();snake.forEach((p,i)=>{x.fillStyle=i===0?'#fff':'#aaa';x.fillRect(p.x*S+2,p.y*S+2,S-4,S-4)})}
function setDir(k){const d={ArrowUp:{x:0,y:-1},w:{x:0,y:-1},W:{x:0,y:-1},ArrowDown:{x:0,y:1},s:{x:0,y:1},S:{x:0,y:1},ArrowLeft:{x:-1,y:0},a:{x:-1,y:0},A:{x:-1,y:0},ArrowRight:{x:1,y:0},d:{x:1,y:0},D:{x:1,y:0}}[k];if(d&&!(d.x===-dir.x&&d.y===-dir.y))next=d}
document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();setDir(e.key)});
let sx=0,sy=0;c.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});c.addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<12)return;if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?'ArrowRight':'ArrowLeft');else setDir(dy>0?'ArrowDown':'ArrowUp')});
document.getElementById('start').addEventListener('click',reset);snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir={x:1,y:0};next={x:1,y:0};food={x:14,y:10};score=0;level=1;foodInLevel=0;speed=START_SPEED;running=false;updateHud();draw();
})();</script></body></html>
