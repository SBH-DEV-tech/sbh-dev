<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111111"><title>Memory Match | SBH DEV Arcade</title><style>
*{box-sizing:border-box}body{margin:0;background:#101010;color:#f7f7f7;font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}.wrap{width:min(100%,760px);text-align:center}h1{font-size:clamp(24px,5vw,38px);margin:0 0 5px;letter-spacing:-1px}.sub{color:#aaa;margin:0 0 15px;font-size:13px}.bar{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:0 0 12px}.pill{border:1px solid #454545;border-radius:999px;padding:6px 12px;font-size:13px;color:#ddd}button{font:inherit;cursor:pointer;border:0;background:#f5f5f5;color:#111;padding:10px 16px;font-weight:750;border-radius:4px}button:focus-visible{outline:3px solid #aaa;outline-offset:3px}canvas{display:block;width:100%;height:auto;background:#080808;border:1px solid #444;border-radius:8px;touch-action:none}.hint{color:#aaa;font-size:12px;margin:12px 0 0}.board{margin:auto;display:grid;gap:8px;max-width:420px}.card{aspect-ratio:1;background:#242424;color:#fff;border:1px solid #555;border-radius:8px;font-size:clamp(22px,5vw,36px);display:flex;align-items:center;justify-content:center;min-width:0;padding:0}.card.revealed,.card.matched{background:#f5f5f5;color:#111;border-color:#f5f5f5}.status{min-height:24px;color:#ddd;font-size:13px;margin:10px 0}@media(max-width:480px){body{padding:10px}.pill{padding:5px 9px}}
</style></head><body><main class="wrap"><h1>Memory Match</h1><p class="sub">Flip the cards and find all matching pairs.</p><div class="bar"><span class="pill">Moves: <b id="moves">0</b></span><span class="pill">Pairs: <b id="pairs">0 / 8</b></span><button id="restart">New Game</button></div><div class="board" id="board" aria-label="Memory matching cards" style="grid-template-columns:repeat(4,minmax(0,1fr))"></div><p class="status" id="status">Find all eight pairs.</p><p class="hint">Tap or click two cards to reveal them.</p></main><script>(()=>{const board=document.getElementById('board'),movesEl=document.getElementById('moves'),pairsEl=document.getElementById('pairs'),status=document.getElementById('status'),symbols=['◆','●','▲','★','♥','☀','✚','⬟'];let first=null,lock=false,moves=0,pairs=0,matched=new Set();function start(){const deck=[...symbols,...symbols].sort(()=>Math.random()-.5);board.innerHTML='';first=null;lock=false;moves=0;pairs=0;matched=new Set();movesEl.textContent=0;pairsEl.textContent='0 / 8';status.textContent='Find all eight pairs.';deck.forEach((sym,i)=>{const b=document.createElement('button');b.className='card';b.type='button';b.textContent='?';b.setAttribute('aria-label','Hidden card '+(i+1));b.dataset.symbol=sym;b.dataset.index=i;b.addEventListener('click',()=>flip(b));board.appendChild(b)})}function flip(b){if(lock||b.classList.contains('revealed')||b.classList.contains('matched'))return;b.classList.add('revealed');b.textContent=b.dataset.symbol;b.setAttribute('aria-label',b.dataset.symbol);if(!first){first=b;return}moves++;movesEl.textContent=moves;if(first.dataset.symbol===b.dataset.symbol){first.classList.add('matched');b.classList.add('matched');pairs++;pairsEl.textContent=pairs+' / 8';first=null;if(pairs===8)status.textContent='You matched every pair in '+moves+' moves. Great job!';return}lock=true;const prev=first;first=null;setTimeout(()=>{[prev,b].forEach(card=>{card.classList.remove('revealed');card.textContent='?';card.setAttribute('aria-label','Hidden card')});lock=false},700)}document.getElementById('restart').addEventListener('click',start);start()})();</script></body></html>
