<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111111"><title>Brick Breaker | SBH DEV Arcade</title><style>
*{box-sizing:border-box}body{margin:0;background:#101010;color:#f7f7f7;font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}.wrap{width:min(100%,760px);text-align:center}h1{font-size:clamp(24px,5vw,38px);margin:0 0 5px;letter-spacing:-1px}.sub{color:#aaa;margin:0 0 15px;font-size:13px}.bar{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:0 0 12px}.pill{border:1px solid #454545;border-radius:999px;padding:6px 12px;font-size:13px;color:#ddd}button{font:inherit;cursor:pointer;border:0;background:#f5f5f5;color:#111;padding:10px 16px;font-weight:750;border-radius:4px}button:focus-visible{outline:3px solid #aaa;outline-offset:3px}canvas{display:block;width:100%;height:auto;background:#080808;border:1px solid #444;border-radius:8px;touch-action:none}.hint{color:#aaa;font-size:12px;margin:12px 0 0}.board{margin:auto;display:grid;gap:8px;max-width:420px}.card{aspect-ratio:1;background:#242424;color:#fff;border:1px solid #555;border-radius:8px;font-size:clamp(22px,5vw,36px);display:flex;align-items:center;justify-content:center;min-width:0;padding:0}.card.revealed,.card.matched{background:#f5f5f5;color:#111;border-color:#f5f5f5}.status{min-height:24px;color:#ddd;font-size:13px;margin:10px 0}@media(max-width:480px){body{padding:10px}.pill{padding:5px 9px}}
</style></head><body><main class="wrap"><h1>Brick Breaker</h1><p class="sub">Clear the bricks. Keep the ball in play.</p><div class="bar"><span class="pill">Score: <b id="score">0</b></span><span class="pill">Lives: <b id="lives">3</b></span><button id="start">Start / Restart</button></div><canvas id="game" width="720" height="480" aria-label="Brick Breaker game"></canvas><p class="hint">Move: ← → or A/D · On touchscreens, drag your finger across the game.</p><p class="status" id="status">Press Start to play.</p></main><script>(()=>{const c=document.getElementById('game'),x=c.getContext('2d'),scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),status=document.getElementById('status');let paddle,ball,bricks,score,lives,running,keys={},raf=0;const W=c.width,H=c.height;function reset(){paddle={x:W/2-55,y:H-34,w:110,h:12,s:7};ball={x:W/2,y:H-55,r:8,dx:3.2,dy:-3.8};bricks=[];for(let r=0;r<5;r++)for(let col=0;col<9;col++)bricks.push({x:35+col*73,y:45+r*27,w:62,h:16,alive:true});score=0;lives=3;scoreEl.textContent=score;livesEl.textContent=lives;running=true;status.textContent='';cancelAnimationFrame(raf);loop()}function draw(){x.clearRect(0,0,W,H);x.fillStyle='#151515';x.fillRect(0,0,W,H);bricks.forEach((b,i)=>{if(b.alive){x.fillStyle=['#eee','#c9c9c9','#999','#666','#444'][Math.floor(i/9)];x.fillRect(b.x,b.y,b.w,b.h)}});x.fillStyle='#fff';x.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);x.beginPath();x.arc(ball.x,ball.y,ball.r,0,Math.PI*2);x.fillStyle='#fff';x.fill();}function loop(){if(!running)return;if(keys.ArrowLeft||keys.a||keys.A)paddle.x-=paddle.s;if(keys.ArrowRight||keys.d||keys.D)paddle.x+=paddle.s;paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));ball.x+=ball.dx;ball.y+=ball.dy;if(ball.x<ball.r||ball.x>W-ball.r)ball.dx*=-1;if(ball.y<ball.r)ball.dy*=-1;if(ball.dy>0&&ball.y+ball.r>=paddle.y&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w){ball.dy=-Math.abs(ball.dy);ball.dx=((ball.x-(paddle.x+paddle.w/2))/(paddle.w/2))*4.6}for(const b of bricks){if(b.alive&&ball.x>b.x&&ball.x<b.x+b.w&&ball.y-ball.r<b.y+b.h&&ball.y+ball.r>b.y){b.alive=false;ball.dy*=-1;score+=10;scoreEl.textContent=score;break}}if(ball.y>H+ball.r){lives--;livesEl.textContent=lives;if(!lives){running=false;status.textContent='Game over! Press Start to try again.';draw();return}ball={x:W/2,y:H-55,r:8,dx:3.2,dy:-3.8}}if(bricks.every(b=>!b.alive)){running=false;status.textContent='You cleared the board! Press Start to play again.';draw();return}draw();raf=requestAnimationFrame(loop)}document.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});document.addEventListener('keyup',e=>keys[e.key]=false);let dragging=false;function move(e){const r=c.getBoundingClientRect(),clientX=e.clientX??(e.touches&&e.touches[0].clientX);if(clientX==null)return;paddle.x=(clientX-r.left)/r.width*W-paddle.w/2;paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x))}c.addEventListener('pointerdown',e=>{dragging=true;c.setPointerCapture(e.pointerId);move(e)});c.addEventListener('pointermove',e=>{if(dragging)move(e)});c.addEventListener('pointerup',()=>dragging=false);document.getElementById('start').addEventListener('click',reset);draw()})();</script></body></html>
